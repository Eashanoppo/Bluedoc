version: "3.9"

services:
  api:
    build:
      context: ./BlueDoc.Cloud.Api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Default=Host=db;Database=bluedoc;Username=bluedoc;Password=${DB_PASSWORD:-bluedoc_secret_pass_2026}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bluedoc
      POSTGRES_USER: bluedoc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bluedoc_secret_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluedoc"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

